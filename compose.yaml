services:
  ip-watch:
    build:
      context: .
      target: runtime
    env_file:
      - path: .env
        required: false
    network_mode: host
    user: node
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    volumes:
      - ip-watch-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/health').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ip-watch-data:
